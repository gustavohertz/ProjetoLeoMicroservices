# Configuração usada apenas nos testes de contexto.
# Banco em memória (H2) para não exigir o PostgreSQL durante o build.
spring.datasource.url=jdbc:h2:mem:eventos;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop

# Não conecta no Eureka durante os testes
eureka.client.enabled=false

# Os listeners não sobem (sem broker Kafka nos testes)
spring.kafka.listener.auto-startup=false
spring.kafka.bootstrap-servers=localhost:9092
