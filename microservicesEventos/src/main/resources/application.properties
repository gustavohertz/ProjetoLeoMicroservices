spring.application.name=microservicesEventos
server.port=8082

# Service Registry (Eureka)
eureka.client.restclient.enabled=true
eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka/

# Banco de dados próprio (PostgreSQL - via docker-compose)
spring.datasource.url=jdbc:postgresql://localhost:5432/eventosdb
spring.datasource.username=eventos
spring.datasource.password=eventos
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Kafka
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=eventosGroup
spring.kafka.consumer.auto-offset-reset=earliest
# Consumimos os eventos como JSON e deixamos o JsonMessageConverter (KafkaConsumerConfig)
# converter para o tipo do parâmetro de cada @KafkaListener, ignorando o pacote de origem.
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

# Producer (caso o serviço precise publicar eventos no futuro)
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
